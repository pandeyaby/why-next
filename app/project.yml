# XcodeGen spec for Why Next? (one multiplatform target: iPhone, iPad, Mac).
# Generate the Xcode project on a Mac with:  brew install xcodegen && xcodegen
name: WhyNext
options:
  bundleIdPrefix: com.pandeyaby
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""          # pick your Personal Team in Signing & Capabilities (or set it here)
    CODE_SIGN_STYLE: Automatic
packages:
  WhyNextCore:
    path: WhyNextCore
targets:
  WhyNext:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: WhyNext
        excludes:
          - "Resources/Web"
      # offline lessons + reels from tools/sync_content.py, copied as a folder so the web build keeps its layout
      - path: WhyNext/Resources/Web
        type: folder
        buildPhase: resources
    dependencies:
      - package: WhyNextCore
    info:
      path: WhyNext/Info.plist
      properties:
        CFBundleDisplayName: Why Next?
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "Data builds on the Marble Skill Taxonomy v1 © Generative Spark, Inc., used under ODbL 1.0 and CC BY-SA 4.0."
        UILaunchScreen:
          UIColorName: Canvas
        UISupportedInterfaceOrientations~iphone: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
    settings:
      base:
        PRODUCT_NAME: WhyNext
        PRODUCT_BUNDLE_IDENTIFIER: com.pandeyaby.whynext   # must be unique to your Apple ID; change if Xcode says it's taken
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": WhyNext/Resources/WhyNext-macOS.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
schemes:
  WhyNext:
    build:
      targets:
        WhyNext: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: WhyNextCore/WhyNextCoreTests
    archive:
      config: Release
